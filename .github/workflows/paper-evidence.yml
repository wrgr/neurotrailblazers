name: Paper evidence integrity
on:
  pull_request:
  push:
    branches: [main, fix/paper-evidence-first-190]
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unprovenanced publication claims
        run: python3 scripts/check_paper_evidence.py
