name: Prepare usability follow-up
on:
  push:
    branches: [codex/usability-navigation-followup]
    paths: [.github/workflows/prepare-usability-followup.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/usability-navigation-followup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/usability-navigation-followup
      - name: Apply guarded source edits
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/apply-usability.py
          node --check assets/js/paper-browser.js
          node --check assets/js/usability-followup.js
          node --check assets/js/module-interactives.js
          node --check scripts/check_usability_followup.cjs
          git diff --check
          rm scripts/apply-usability.py .github/workflows/prepare-usability-followup.yml
      - name: Commit source changes to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify navigation, paginate papers, and distinguish progress from assessment'
          git push origin HEAD:refs/heads/codex/usability-navigation-followup
      - name: Save exact source evidence
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/neurotrailblazers-review-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: usability-review-source
          path: |
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/neurotrailblazers-review-source.tar.gz
          retention-days: 3
