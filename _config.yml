# NeuroTrailblazers - Jekyll Configuration
title: "NeuroTrailblazers"
description: "Mapping connections. Making connections. Training the people who map the brain: an open curriculum and mentorship program for nanoscale connectomics, in the NIH BRAIN CONNECTS program."

# The site line. One place, so it cannot drift again; see docs/brand/BRAND_GUIDE.md §2.
tagline: "Mapping connections. Making connections."
tagline_sentence: "Training the people who map the brain."
baseurl: ""
url: "https://neurotrailblazers.org"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  modules:
    output: true
    permalink: /:collection/:name/
  # One file per dataset under _datasets/. Everything the site says about a dataset is
  # rendered from these records, so a number appears in exactly one place. Before this
  # existed, the featured cards and the timeline on /datasets/ described the same
  # datasets twice and had already diverged on H01's cell count, its synapse count and
  # its date.
  #
  # Schema. Only `title` is required; omit a field rather than guessing at it, and
  # every record carries `source:` naming where its numbers came from.
  #   title, short_name          display name, and a short form for cards
  #   species, region, volume    what was imaged
  #   cells, synapses           reconstruction scale, as published
  #   size, resolution, modality how it was acquired
  #   portal, paper_doi,
  #   paper_url, press_url       where to go next
  #   access, status             what a reader can actually get today
  #   release_year               integer; orders the timeline
  #   featured, spotlight        booleans; select and rank the cards on /datasets/
  #   blurb                      one or two sentences for the card
  #   source                     provenance for every number above
  # The body is a short page: what it is, what it is good for, what it does not support.
  datasets:
    output: true
    # Not /datasets/:name/ — that namespace already holds the hand-written guides
    # (access, getting-started, mouseconnects, workflow) and mouseconnects would collide.
    permalink: /datasets/catalog/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "modules"
    values:
      layout: "module"
  - scope:
      path: "modules"
      type: ""
    values:
      layout: "module"
      permalink: "/modules/:basename/"
  - scope:
      path: ""
      type: "datasets"
    values:
      layout: "dataset-entry"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Site configuration
author: "NeuroTrailblazers Team"
email: "info@neurotrailblazers.org"
twitter_username: neurotrailblazers
github_username: wrgr

# Base URL for linking a Marp slide source on GitHub.
#
# The .marp.md sources are excluded from the build (see `exclude` below) because
# Jekyll would render them as unstyled duplicate pages, so they cannot be linked
# as site paths. Markdown is the format worth handing someone who wants to adapt
# a deck rather than present it as-is, and the repo is where they would fork it
# from anyway. Kept here so the deck links live in one place instead of across
# ~60 generated and hand-maintained pages.
deck_source_base: "https://github.com/wrgr/neurotrailblazers/blob/main/course/decks/marp"

# Grant and program information
grant_info:
  program: "NIH BRAIN CONNECTS"
  grant: "Mouse Connectome Project"
  funding_agency: "National Institutes of Health"
  focus: "connectome quality and dissemination"

# Program tagline used across pages
tagline_lines:
  - "Our research incubators equip students and mentors with the tools, guidance, and experience to accelerate innovation in neuroscience and AI."
  - "NeuroTrailblazers applies this framework to the audacious goal of mapping the networks of the brain at the level of individual synaptic connections, and makes tools, training and content available to the BRAIN CONNECTS community and beyond."

# Color palette
colors:
  neural_blue: "#2563eb"
  cerebral_purple: "#7c3aed"
  axon_cyan: "#06b6d4"
  brain_gray: "#f3f4f6"
  synapse_black: "#111827"

# Exclude from processing
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - scripts
  # Working files for the technical track: unit source specs, deck specs,
  # and ingest transcripts. These are build inputs, not pages. Publishing
  # them produced ~60 unstyled draft pages that duplicated the real
  # technical units and exposed local authoring paths. The rendered
  # decks under course/decks/marp/out/ are static assets and stay published.
  # (Planning boards, reviews, and templates live on the
  # holding/internal-planning branch, off the deployed branch entirely.)
  - course/source-ingest
  - course/units
  - course/README.md
  - course/decks/README.md
  - course/decks/content-import-matrix.md
  - course/decks/marp/modules
  - course/decks/marp/*.marp.md
  - course/decks/marp/README.md
  # EN.585.781 graduate-course decks: sources and theme are excluded like the
  # others; the rendered HTML under course/decks/marp/out/ stays published.
  - course/decks/marp/en585781
  - course/decks/0*.md
  - course/decks/atlas-connectomics-reference.md
  # Internal reviews, planning boards and the brand guide. Working documents,
  # not pages; publishing them would add unstyled duplicates of the planning
  # material that otherwise lives on holding/internal-planning.
  - docs

# Fix for Jekyll SCSS encoding issues
encoding: utf-8
sass:
  syntax: scss
  style: compressed
