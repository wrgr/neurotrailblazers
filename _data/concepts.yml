# Concept Explorer data.
#
# Consumers: concepts/index.md (the explorer), _includes/ui/track-need-explorer.html
# (the per-track "Find by Need" section on /tracks/*), _includes/ui/technical-unit-concepts.html
# (the "Related concepts" block on each technical unit, keyed by
# _data/technical_track.yml primary_concepts) and technical-training/index.md (whose
# need buttons link to the explorer with ?track=...&need=...).
#
# Schema, per concept:
#   slug            stable key; other data files reference it, so do not rename
#   title           card title
#   track           core-concepts-methods | research-in-action | career-and-community
#   user_needs      short lowercase phrases; they become the "What you are trying to
#                   do" filter. Reuse an existing phrase before coining one, because
#                   the filter is only useful when concepts share vocabulary. The
#                   five needs that technical-training/index.md links by exact string
#                   are: starting a research question, improving data quality,
#                   reducing identity confusion, prioritizing corrections,
#                   designing graph analyses.
#   summary         one sentence: what the skill is
#   explanation     one sentence: how to learn it from the linked pages
#   resources       the first entry is the card's title link; the rest are shown as
#                   "Related resources" when there is no teaching_resources block
#   teaching_resources
#                   optional lesson / activity / slides / references lists. Every url
#                   must be a permalink that exists; deep links must point at a
#                   heading that exists (scripts/check_anchor_links.rb checks the
#                   built site).
#
# Every summary describes only what its target pages contain.

concepts:
