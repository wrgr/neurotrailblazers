# Instructional visual supplements; design-coordinator owned.
# Not scored assessments or module-readiness decisions.
modules:
  module02:
  - type: flow
    title: Make your help request actionable
    lead: 'Illustrative request: “My result changed after a data update.”'
    steps:
    - label: Show the goal
      text: What were you trying to measure?
    - label: Show the evidence
      text: Record the version, query and difference.
    - label: Name the decision
      text: Ask which comparison or permission to check.
    prompt: Who can answer this question, and what do they need from you?
    description: 'The boxes organize a request: goal, evidence and decision. They are not a test of confidence or social style. Requests can be written, spoken, or made with support.'
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
  - type: flow
    title: Make a support map you can use
    lead: A fictional lab has three different points of contact.
    steps:
    - label: Peer or mentor
      text: Help with a method or an unclear expectation.
    - label: Dataset steward
      text: Clarify documentation, access or reuse boundaries.
    - label: Supervisor or support office
      text: Resolve responsibilities or a concern needing escalation.
    prompt: Write one question for each role. Do not include private disclosures.
    description: These are alternative routes, not a compulsory hierarchy. Actual responsibilities vary. Check local written guidance; a learner need not approach a peer before using an appropriate route for a sensitive concern.
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
  module03:
  - type: flow
    title: A notebook is a repeatable chain
    lead: Treat the saved result as the output of a declared process.
    steps:
    - label: Inputs
      text: Table + version + units
    - label: Method
      text: Run code in a stated order
    - label: Outputs
      text: Labeled result + parameters
    - label: Clean rerun
      text: Restart; run all; compare
    prompt: Which link in this chain is missing from your notebook?
    description: The sequence represents dependencies, not a guarantee of reproducibility. A clean rerun checks hidden interactive state. A picture alone does not record the inputs or code that produced it.
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
  - type: code
    title: A tiny result you can verify by hand
    lead: Synthetic counts, not a biological finding. No account or download needed.
    code: |
      counts = {"A": 4, "B": 1, "C": 0}
      total = sum(counts.values())
      print(total)
      print(total / len(counts))
    output: |
      Total: 5
      Mean across A, B, C: 1.666…
    prompt: What changes if the zero-count row is omitted?
    description: All three rows give total 5 and mean 5/3. Omitting the zero-count row keeps the total but changes the mean to 5/2 = 2.5. Declare the population represented by the denominator. These are synthetic teaching values.
    source: Synthetic example; arithmetic checked by scripts/check_visual_design.rb.
  module04:
  - type: figure
    title: Read location before interpreting a close-up
    lead: Start with the sample’s anatomical context.
    images:
    - src: /assets/images/content-library/case-studies/h01/11-cortical-layers.jpg
      alt: H01 cortical sample with a labeled layer legend and 1 mm scale bar.
      caption: Released layer map; original legend and scale retained.
    prompt: What context disappears when you zoom to one cell?
    description: The image presents the released segmentation of layers L1 through L6 and white matter. The text legend supplements the colors. A small ultrastructure crop does not contain this location information; use dataset context rather than inferring a layer from one local profile.
    source: 'H01 release, Lichtman Lab / Harvard and Connectomics at Google; Shapson-Coe et al. (2024), doi:10.1126/science.adk4858; CC BY 4.0.'
  - type: figure
    title: Observe first; separate the interpretation
    lead: Compare the whole profile with its surroundings.
    images:
    - src: /assets/images/content-library/case-studies/h01/05-neuron-soma.jpg
      alt: H01 electron micrograph showing a cell body, nucleus, neighboring profiles and a 10 micrometre scale bar.
      caption: Cell-body view from the H01 image series.
    prompt: Name one visible feature and one claim needing more context.
    description: A large cell body with a prominent nucleus is visible among smaller profiles. This is an observation exercise, not a validated cell-type identification item. One section does not establish the cell’s full morphology or function.
    source: 'H01 release, Lichtman Lab / Harvard and Connectomics at Google; Shapson-Coe et al. (2024), doi:10.1126/science.adk4858; CC BY 4.0.'
  module05:
  - type: figure
    title: Check the image before trusting a label
    lead: Inspect the underlying electron microscopy, not just a colorful overlay.
    images:
    - src: /assets/images/content-library/case-studies/h01/10a-raw-em.jpg
      alt: Raw H01 electron microscopy with membrane profiles and an intact 2 micrometre scale bar.
      caption: Underlying image, without a segmentation overlay.
    prompt: What would make you inspect neighboring sections?
    description: The field contains adjacent membrane profiles and organelles. This is an inspection example, not a deliberately corrupted image with a hidden answer key. Review continuity, contrast, section context and scale before deciding whether a region needs to be flagged.
    source: 'H01 release, Lichtman Lab / Harvard and Connectomics at Google; Shapson-Coe et al. (2024), doi:10.1126/science.adk4858; CC BY 4.0.'
  - type: flow
    title: A flag should lead to a specific check
    lead: An unusual appearance is not a confirmed artifact.
    steps:
    - label: Observe
      text: Describe the discontinuity or ambiguity.
    - label: Compare
      text: Inspect neighbors and acquisition context.
    - label: Decide
      text: Proceed, request review, or rework; state why.
    prompt: What evidence would change your decision?
    description: The workflow separates observation, additional evidence and action. The appropriate action depends on the scientific endpoint and available evidence; unusual appearance alone is not an automatic rejection rule.
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
  module06:
  - type: figure
    title: A segmentation is a claim about continuity
    lead: The same field, before and after model labels are overlaid.
    images:
    - src: /assets/images/content-library/case-studies/h01/10a-raw-em.jpg
      alt: Raw H01 image at the same field and scale as the labeled view.
      caption: Underlying image
    - src: /assets/images/content-library/case-studies/h01/10b-segmentation-overlay.jpg
      alt: The same H01 field with object colors overlaid and the 2 micrometre scale bar intact.
      caption: Model object labels
    prompt: What evidence would you need before calling a merge or split?
    description: Colors identify model objects, not confidence scores or verified ground truth. Inspect the raw image and continuity across sections before accepting or changing an object’s topology.
    source: 'H01 release, Lichtman Lab / Harvard and Connectomics at Google; Shapson-Coe et al. (2024), doi:10.1126/science.adk4858; CC BY 4.0.'
  - type: figure
    title: Two reconstruction choices can disagree
    lead: Inspect local evidence before choosing a correction.
    images:
    - src: /assets/images/content-library/em/segmentation-c2-vs-c3.jpg
      alt: 'Two panels of the same H01 region: c2 assigns one object; c3 separates the highlighted regions into two.'
      caption: 'Left: c2, one object. Right: c3, two objects.'
    prompt: Which additional view would help adjudicate this difference?
    description: The panel labels identify the one-object versus two-object distinction without relying on color alone. This view illustrates reconstruction disagreement; it does not by itself establish the correct biological topology.
    source: 'H01 release, Lichtman Lab / Harvard and Connectomics at Google; Shapson-Coe et al. (2024), doi:10.1126/science.adk4858; CC BY 4.0.'
  module07:
  - type: figure
    title: Review the edit, not just the final picture
    lead: Follow the field through an automated result and a human revision.
    images:
    - src: /assets/images/content-library/em/proofreading-before-after.jpg
      alt: 'Three panels: raw image, automated selection and selection after proofreading. A region selected in the middle panel is removed in the right panel.'
      caption: 'Left: raw. Middle: automated. Right: after proofreading.'
    prompt: What should be recorded so another reviewer can audit the edit?
    description: In the middle panel the small upper-right selected region is removed in the final panel; the large lower-left selected region remains. This positional description supplements the green/red encoding. The example illustrates one edit, not a complete release audit.
    source: 'H01 release, Lichtman Lab / Harvard and Connectomics at Google; Shapson-Coe et al. (2024), doi:10.1126/science.adk4858; CC BY 4.0.'
  - type: flow
    title: Prioritize against the scientific endpoint
    lead: The most conspicuous error may not have the greatest impact.
    steps:
    - label: State the endpoint
      text: Which result could change?
    - label: Review the risk
      text: Weigh evidence, uncertainty and correction cost.
    - label: Record the decision
      text: Fix, defer or request adjudication; document why.
    prompt: When might deferring an edit be defensible?
    description: These are triage questions, not a universal ranking of merge and split errors. Unresolved uncertainty should stay visible in the release record even when a team defers an edit.
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
  module08:
  - type: flow
    title: Connect the question to the comparison
    lead: A structural claim needs a measurable endpoint.
    steps:
    - label: Hypothesis
      text: Which pattern and sample?
    - label: Metric
      text: What will be measured?
    - label: Null model
      text: What does the comparison preserve?
    - label: Boundary
      text: What does this not establish?
    prompt: Which assumption does your null model leave untested?
    description: Different null models preserve different properties. A finding is conditional on the comparison and sampling design; structural association alone does not establish function or causation.
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
  - type: table
    title: A difference is not yet a conclusion
    lead: Hypothetical counts, supplied to discuss interpretation.
    headers: [Quantity, Count]
    rows:
    - ['Observed reciprocal pairs', '12']
    - ['Median across null graphs', '8']
    prompt: What is missing before calling this evidence of enrichment?
    description: Twelve is four more than eight, but no null distribution, sample size, sampling unit or uncertainty is supplied. A ratio of 1.5 alone does not establish statistical significance or a mechanism. Ask how the null graphs were produced and what they preserve.
    source: Synthetic scenario; Module 08 metric, null model and interpretation workflow.
  module09:
  - type: tree
    title: A skeleton makes measurement choices explicit
    lead: Synthetic planar tree. Coordinates are in micrometres.
    prompt: Compute total cable length and both root-to-tip path lengths.
    description: Root A is (0,0), B is (0,3), C is (-4,3), and D is (4,3). Edges A–B, B–C and B–D measure 3, 4 and 4 micrometres. Total length is 11; each root-to-tip path is 7. There is one branching node, B, and two terminal nodes, C and D. Root-to-tip Euclidean distance is 5, so tortuosity is 7/5 = 1.4 under that definition.
    source: Synthetic fixture; exact geometry checked by scripts/check_visual_design.rb.
  - type: flow
    title: A missing branch changes the story
    lead: Use the synthetic tree on the previous slide.
    steps:
    - label: Complete example
      text: 'Three edges: total length 11 µm.'
    - label: Truncated example
      text: 'Remove B–D: measured length is 7 µm.'
    - label: Report the limit
      text: The lower value describes the observed reconstruction.
    prompt: Does a lower measurement prove a smaller biological arbor?
    description: Removing the four-micrometre B–D edge changes the observed total from 11 to 7. That does not establish that the biological cell had a smaller arbor. Report what was reconstructed and how missing structure affects interpretation.
    source: Illustrative teaching scenario; see this module’s lesson and worked example.
