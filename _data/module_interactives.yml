# Interactive lab content per module.
#
# correct_index must NOT be uniform. Every value in this file was 0 before
# 2026-08-20, so always clicking the first option scored 100% on all 25
# module pages. Keep the distribution balanced when adding questions.
#
# The Annotation Challenge was removed entirely on 2026-08-20. Its hotspot
# coordinates were formulaic (evenly spaced round numbers) and had never been
# placed against the figures. Checked against the images, module05's 'correct'
# hotspot sat in blank white space between two panels, and module07's sat on
# the rim of a clock icon that had been used as a stand-in figure. A learner
# reasoning correctly was marked wrong. Restore this only with coordinates
# verified against real image features -- the ?calibrate=1 mode in
# assets/js/module-interactives.js exists for exactly that purpose.
default:
  quiz:
    title: Checkpoint Quiz
    pass_score: 2
    questions:
    - prompt: Which output most clearly demonstrates module competency?
      options:
      - A measurable artifact linked to an explicit method
      - A general reflection about interest in neuroscience
      - A list of future goals without evidence
      correct_index: 0
      explanation: Competency is shown through measurable, method-linked evidence.
    - prompt: What should always accompany a technical claim in this curriculum?
      options:
      - A motivational quote
      - A citation count
      - A limitation or uncertainty statement
      correct_index: 2
      explanation: Every claim should include boundaries and uncertainty.
    - prompt: What is the best next step after identifying a gap in understanding?
      options:
      - Ignore the gap if progress is slow
      - Define a concrete practice task and verification criterion
      - Skip to a harder module
      correct_index: 1
      explanation: Progress improves when gaps become explicit practice targets.
  task:
    title: Microtask Decision
    prompt: Choose the action that best improves scientific reliability.
    options:
    - Record method, version, and decision rationale before sharing results
    - Rely on memory for why decisions were made
    - Share results quickly and document details later
    correct_index: 0
    correct_feedback: Correct. Traceability and rationale improve reliability and reproducibility.
    incorrect_feedback: Try again. Prioritize traceability and explicit rationale.
  progress_steps:
  - Read capability target
  - Complete studio activity
  - Review assessment rubric
  - Pass checkpoint quiz
  - Complete microtask
  - Complete annotation challenge
modules:
  module01:
    quiz:
      title: Why Map the Brain Checkpoint
      pass_score: 2
      questions:
      - prompt: 'A strong connectomics question should include:'
        options:
        - A guaranteed clinical impact claim
        - A measurable structural output
        - Only a broad societal motivation
        correct_index: 1
        explanation: Questions should map to measurable structural outcomes.
      - prompt: Which statement reflects good evidence discipline?
        options:
        - A connectome alone explains all behavior
        - Any high-resolution image proves mechanism
        - Structure constrains hypotheses but does not prove all function
        correct_index: 2
        explanation: Structure informs mechanism but does not fully prove it alone.
      - prompt: 'Best non-claim for an early-stage module 01 question:'
        options:
        - No limitations are needed
        - This map alone does not establish causal dynamics
        - This map proves memory formation
        correct_index: 1
        explanation: A non-claim should explicitly mark evidence boundaries.
    task:
      title: Question Framing Microtask
      prompt: Pick the best study question for a first connectomics project.
      options:
      - Can one EM volume explain all cognition?
      - How does consciousness emerge from the entire brain?
      - Which synapse-density differences appear between two defined hippocampal subregions?
      correct_index: 2
      correct_feedback: Correct. It is scoped, measurable, and testable.
      incorrect_feedback: Not yet. Choose the option with clear scope and measurable outputs.
  module02:
    task:
      title: Scale Selection Microtask
      prompt: Your question needs synapse-level evidence across a small region. Best approach?
      options:
      - High-resolution EM in a bounded volume with compute/storage planning
      - No data constraints until analysis
      - Whole-brain low-resolution imaging only
      correct_index: 0
      correct_feedback: Correct. Match scale to required evidence and budget.
      incorrect_feedback: Try again. Scale, resolution, and compute constraints must align with the question.
  module03:
    task:
      title: Artifact Triage Microtask
      prompt: What should happen before reconstruction starts?
      options:
      - Skip QA if images appear mostly clean
      - Start segmentation immediately
      - Apply artifact QA gates and record pass/fail decisions
      correct_index: 2
      correct_feedback: Correct. Upstream QA prevents downstream compounding errors.
      incorrect_feedback: Try again. QA gates are required before reconstruction.
  module04:
    task:
      title: Pipeline Architecture Microtask
      prompt: Which feature is most critical for reconstruction reliability?
      options:
      - Single-script processing with no versioning
      - Dataset lineage with rollback-capable releases
      - Manual file renaming
      correct_index: 1
      correct_feedback: Correct. Lineage and rollback are core infrastructure requirements.
      incorrect_feedback: Try again. Reliable pipelines require lineage and release discipline.
  module05:
    task:
      title: Ultrastructure Interpretation Microtask
      prompt: Best response to an ambiguous ultrastructure cue?
      options:
      - Label uncertainty and request second-pass review
      - Delete the region
      - Force a confident label
      correct_index: 0
      correct_feedback: Correct. Ambiguity should be explicit and reviewable.
      incorrect_feedback: Try again. Do not force labels when evidence is ambiguous.
  module06:
    task:
      title: Process ID Microtask
      prompt: 'To distinguish axon vs dendrite reliably, prioritize:'
      options:
      - Multiple cues across morphology and context
      - Random choice then post hoc justification
      - Single visual cue in one slice
      correct_index: 0
      correct_feedback: Correct. Multi-cue decisions reduce classification error.
      incorrect_feedback: Try again. Use multiple converging cues.
  module07:
    task:
      title: Glia Boundary Microtask
      prompt: Which action best reduces glia-neuron boundary errors?
      options:
      - Use class-specific ultrastructure signatures plus boundary checks
      - Skip myelin context
      - Apply neuron rules to all cells
      correct_index: 0
      correct_feedback: Correct. Glia-aware signatures and boundary checks are essential.
      incorrect_feedback: Try again. Glia-specific decision cues are required.
  module08:
    task:
      title: Proofreading Triage Microtask
      prompt: How should correction queues be prioritized?
      options:
      - By easiest edits only
      - By oldest timestamp only
      - By expected scientific impact and error severity
      correct_index: 2
      correct_feedback: Correct. Impact-aware triage improves release quality.
      incorrect_feedback: Try again. Prioritize impact, not convenience.
  module09:
    task:
      title: NeuroAI Analysis Microtask
      prompt: 'Before reporting a motif result, include:'
      options:
      - Only a visualization
      - Null-model comparison and uncertainty statement
      - Only a model architecture description
      correct_index: 1
      correct_feedback: Correct. Null comparison and uncertainty are required for defensible claims.
      incorrect_feedback: Try again. Add null-model context and uncertainty.
