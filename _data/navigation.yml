---
# Site navigation.
#
# `items` is the header menu: six groups, each a hub page plus a dropdown. A
# dropdown entry with `heading:` instead of `title:` renders as a non-link
# label that splits the list (Teaching uses two: run a session, plan and
# assess). Keep a dropdown to about nine links; add a heading before adding a
# tenth, and move something to its hub page before adding a twelfth.
#
# The footer repeats the six group hubs from this list, so a page with the
# menu collapsed still has a route to every section at the bottom.
items:
  - title: "Start Here"
    url: "/start-here/"
  - title: "Learn"
    url: "/tracks/"
    dropdown:
      - title: "Choose a learning path"
        url: "/tracks/"
      - title: "Modes of use — alone or in a group"
        url: "/modes/"
      - title: "Technical Course — nine units"
        url: "/technical-training/"
      - title: "Module Library — 25 topics"
        url: "/modules/"
      - title: "MICrONS Real-Data Lab"
        url: "/notebooks/microns-lab/"
      - title: "Proofreading Tutorials"
        url: "/technical-training/proofreading-tutorials/"
      - title: "Neuronauts — explore the brain"
        url: "/neuronauts/"
      - title: "Junior Lab — kids and families"
        url: "/neuronauts/kids/"
      - title: "Side Quests"
        url: "/side-quests/"
  - title: "Reference"
    url: "/content-library/"
    dropdown:
      - title: "The Core — what to consult"
        url: "/core/"
      - title: "Content Library"
        url: "/content-library/"
      - title: "Connectomics Dictionary"
        url: "/technical-training/dictionary/"
      - title: "Datasets"
        url: "/datasets/"
      - title: "Journal Club — search papers"
        url: "/technical-training/journal-club/"
      - title: "Citation Graph Explorer"
        url: "/technical-training/journal-club/graph/"
      - title: "The Field, Mapped"
        url: "/kb/"
      - title: "Connectomics Reference Atlas"
        url: "/technical-training/atlas-connectomics-reference/"
      - title: "Hidden Curriculum"
        url: "/hidden-curriculum/"
  - title: "Teaching"
    url: "/teaching/"
    dropdown:
      - heading: "Run a session"
      - title: "Teaching Hub"
        url: "/teaching/"
      - title: "Short lecture series — five sessions"
        url: "/teaching/sequence/"
      - title: "Graduate Lecture Series"
        url: "/teaching/lectures/"
      - title: "Session Kits — 25 modules"
        url: "/teaching/sessions/"
      - title: "Professional Pathways Workshops"
        url: "/teaching/pathways/"
      - title: "Presentation Decks"
        url: "/technical-training/slides/"
      - heading: "Plan and assess"
      - title: "Course Syllabus Maps"
        url: "/teaching/syllabi/"
      - title: "Assessment Bank"
        url: "/teaching/assessment/"
      - title: "Facilitator Guide"
        url: "/teaching/facilitator-guide/"
      - title: "Teaching FAQ"
        url: "/teaching/faq/"
  - title: "Tools"
    url: "/tools/"
    dropdown:
      - title: "All Tools"
        url: "/tools/"
      - title: "Ask an Expert"
        url: "/ask-an-expert/"
      - title: "Connectome Quality"
        url: "/tools/connectome-quality/"
      - title: "Connectome Quality Notebooks"
        url: "/notebooks/connectome-quality/"
      - title: "Concept Explorer"
        url: "/concepts/"
      - title: "Open Problems"
        url: "/open-problems/"
  - title: "About"
    url: "/about/"
    dropdown:
      - title: "About NeuroTrailblazers"
        url: "/about/"
      - title: "What's New"
        url: "/whats-new/"
      - title: "How We Fit BRAIN CONNECTS"
        url: "/core/connects-ecosystem/"
      - title: "Program Models"
        url: "/models/"
      - title: "Major Initiatives"
        url: "/initiatives/"
      - title: "Training Elsewhere"
        url: "/connectivity/"
      - title: "Learner Personas"
        url: "/avatars/"
      - title: "License & Reuse"
        url: "/license/"

# Utility links for the footer's second row. Contact and GitHub are added by
# the layout from _config.yml.
footer:
  - title: "What's new"
    url: "/whats-new/"
  - title: "License"
    url: "/license/"

# Breadcrumb hubs. The layout picks the entry whose `prefix` is the longest
# match for the page URL, then finds which menu group holds that hub, and
# renders "Home › Group › Hub". A page whose URL equals the hub URL is shown
# as the current crumb. Add an entry when a new section gets an index page.
