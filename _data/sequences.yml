---
# Ordered sequences that get previous/next links in the page chrome
# (_includes/ui/page-nav.html), so the content pages do not have to carry them.
#
# Sequences with a single source of order elsewhere are not repeated here:
#   technical units 01-09 and their lecture plans   _data/technical_track.yml
#   modules 01-25 and their session kits             _data/modules.yml
#   module model responses                          the pages under teaching/answers/
#
# Each list has a hub (`url`), a word for one step (`unit_word`), the roles a
# step can have (`roles`, in the order they are shown as companion links), and
# the ordered `items`. An item's `url` is its primary page; other role keys are
# optional. Previous/next stays within the reader's role: from a worksheet you
# go to the next worksheet, not the next plan.
lists:
  - id: lecture-sessions
    title: "Short lecture series"
    url: /teaching/sequence/
    unit_word: Session
    roles:
      - key: url
        label: "Plan and slides"
      - key: activity
        label: "Learner worksheet"
      - key: answers
        label: "Model responses"
    items:
      - title: "Introduction to Connectomics"
        url: /teaching/lectures/connectomics-01-introduction/
        activity: /teaching/lectures/introduction-activity/
        answers: /teaching/lectures/introduction-answers/
      - title: "Synapse Detection"
        url: /teaching/lectures/synapse-detection/
        activity: /teaching/lectures/synapse-detection-activity/
        answers: /teaching/lectures/synapse-detection-answers/
      - title: "Tools and Methods"
        url: /teaching/lectures/connectomics-02-tools-and-methods/
        activity: /teaching/lectures/tools-and-methods-activity/
        answers: /teaching/lectures/tools-and-methods-answers/
      - title: "Algorithms and Applications"
        url: /teaching/lectures/connectomics-03-algorithms-and-applications/
        activity: /teaching/lectures/algorithms-and-applications-activity/
        answers: /teaching/lectures/algorithms-and-applications-answers/
      - title: "Ethics and Governance (optional)"
        url: /teaching/lectures/ethics-and-governance/
        activity: /teaching/lectures/ethics-and-governance-activity/
        answers: /teaching/lectures/ethics-and-governance-answers/

