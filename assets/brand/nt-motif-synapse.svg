<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="NeuroTrailblazers synapse motif">
  <title>NeuroTrailblazers synapse motif</title>
  <rect width="1280" height="720" fill="#10303f"/>
  <g fill="none" stroke="#0f6b73" stroke-opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- dendrite with spines -->
    <path d="M-60 560 C 160 540, 420 470, 700 380 C 900 316, 1060 240, 1240 90" stroke-width="22" stroke-opacity="0.55"/>
    <path d="M300 505 L 318 462" stroke-width="10" stroke-opacity="0.55"/><circle cx="322" cy="452" r="14" fill="#0f6b73" fill-opacity="0.55" stroke="none"/>
    <path d="M520 442 L 545 405" stroke-width="10" stroke-opacity="0.55"/><circle cx="550" cy="395" r="14" fill="#0f6b73" fill-opacity="0.55" stroke="none"/>
    <path d="M760 345 L 745 305" stroke-width="10" stroke-opacity="0.55"/><circle cx="741" cy="294" r="14" fill="#0f6b73" fill-opacity="0.55" stroke="none"/>
    <path d="M960 292 L 990 258" stroke-width="10" stroke-opacity="0.55"/><circle cx="996" cy="248" r="14" fill="#0f6b73" fill-opacity="0.55" stroke="none"/>
    <!-- axons arriving -->
    <path d="M1300 640 C 1100 610, 900 560, 760 470 C 720 445, 700 420, 700 400" stroke-width="12" stroke-opacity="0.45"/>
    <path d="M1320 320 C 1200 300, 1120 280, 1040 262" stroke-width="12" stroke-opacity="0.45"/>
  </g>
  <!-- boutons: the one lit synapse is amber, the others quiet -->
  <circle cx="1012" cy="238" r="26" fill="#e8820c"/>
  <circle cx="1004" cy="232" r="4" fill="#10303f"/><circle cx="1018" cy="229" r="4" fill="#10303f"/><circle cx="1015" cy="245" r="4" fill="#10303f"/><circle cx="1002" cy="245" r="3.5" fill="#10303f"/>
  <circle cx="718" cy="376" r="22" fill="#0f6b73" fill-opacity="0.75"/>
  <!-- faint connectome graph, upper left: nodes and directed edges -->
  <g stroke="#bfe3e4" stroke-opacity="0.22" stroke-width="2" fill="#bfe3e4" fill-opacity="0.35">
    <path d="M120 80 L 260 130 M260 130 L 380 70 M260 130 L 300 250 M120 80 L 60 200 M60 200 L 300 250 M380 70 L 520 150 M520 150 L 300 250" fill="none"/>
    <circle cx="120" cy="80" r="7"/><circle cx="260" cy="130" r="9"/><circle cx="380" cy="70" r="6"/><circle cx="300" cy="250" r="8"/><circle cx="60" cy="200" r="5"/><circle cx="520" cy="150" r="6"/>
  </g>
</svg>
