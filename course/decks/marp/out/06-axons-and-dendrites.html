<h1 id="06-axons-and-dendrites">06 Axons and Dendrites</h1>
<p>Technical Training: Nanoscale Connectomics</p>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="2" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="session-outcomes-60-minutes">Session outcomes (60 minutes)</h2>
<ul>
<li>Classify neurites using a reproducible multi-cue protocol.</li>
<li>Document uncertainty and escalation rationale for edge cases.</li>
<li>Quantify classification quality with confusion-style summaries.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="3" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="pedagogical-arc">Pedagogical arc</h2>
<ul>
<li>Model: expert classifies one neurite live.</li>
<li>Practice: pair annotation on mixed-evidence panels.</li>
<li>Consensus: adjudication and policy revision.</li>
<li>Check: justified final call and uncertainty note.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="4" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="why-this-unit-is-high-leverage">Why this unit is high leverage</h2>
<ul>
<li>Axon/dendrite identity errors distort connectivity statistics.</li>
<li>Misclassification propagates into motif analysis and model priors.</li>
<li>Reproducible identity policy is a prerequisite for trustworthy graphs.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-class="figure" data-theme="neurotrailblazers" lang="POSIX" class="figure" data-marpit-pagination="5" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--class:figure;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="visual-context-morphology-baseline">Visual context: morphology baseline</h2>
<p><img src="../../../../assets/images/technical-training/06-axons-and-dendrites/FIG-RIV-AXDEN-S01-01.png" alt="" style="width:920px;" /></p>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-class="figure" data-theme="neurotrailblazers" lang="POSIX" class="figure" data-marpit-pagination="6" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--class:figure;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="visual-context-dendritic-cue-panel">Visual context: dendritic cue panel</h2>
<p><img src="../../../../assets/images/technical-training/06-axons-and-dendrites/FIG-RIV-AXDEN-S08-01.png" alt="" style="width:920px;" /></p>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="7" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="classify-these-profiles-then-check">Classify these profiles, then check</h2>
<p><img src="../../../../assets/images/content-library/em/neuropil-raw-vs-subcompartments.jpg" alt="" style="width:1080px;" /></p>
<ul>
<li>Left: raw human cortex. Right: the model's answer key.</li>
<li>Blue axon, green dendrite, orange astrocyte — note how many are genuinely hard.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="8" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="real-data-excitatory-vs-inhibitory-synapse">Real data: excitatory vs inhibitory synapse</h2>
<p><img src="../../../../assets/images/content-library/em/synapse-asymmetric-vs-symmetric.jpg" alt="" style="width:1000px;" /></p>
<ul>
<li>Matched scale, nothing drawn over either density.</li>
<li>At 4 nm a Type I PSD is 8–12 px — the asymmetry is subtle, and the classifier is 85–87% accurate.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="9" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="real-data-a-myelinated-axon">Real data: a myelinated axon</h2>
<p><img src="../../../../assets/images/content-library/em/myelinated-axon.jpg" alt="" style="width:560px;" /></p>
<ul>
<li>Compact myelin reads as a dark annulus at 4 nm.</li>
<li>Individual lamellae (12 nm period = 3 px) are NOT resolvable here.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-class="figure" data-theme="neurotrailblazers" lang="POSIX" class="figure" data-marpit-pagination="10" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--class:figure;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="visual-context-axonal-cue-panel">Visual context: axonal cue panel</h2>
<p><img src="../../../../assets/images/technical-training/06-axons-and-dendrites/FIG-RIV-AXDEN-S11-01.png" alt="" style="width:920px;" /></p>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-class="figure" data-theme="neurotrailblazers" lang="POSIX" class="figure" data-marpit-pagination="11" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--class:figure;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="side-by-side-discrimination">Side-by-side discrimination</h2>
<p><img src="../../../../assets/images/technical-training/06-axons-and-dendrites/FIG-RIV-AXDEN-S13-01.png" alt="" style="width:920px;" /></p>
<ul>
<li>Ask learners to justify which cue would survive lower image quality.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-class="figure" data-theme="neurotrailblazers" lang="POSIX" class="figure" data-marpit-pagination="12" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--class:figure;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="ambiguous-process-case">Ambiguous process case</h2>
<p><img src="../../../../assets/images/technical-training/06-axons-and-dendrites/FIG-RIV-AXDEN-S14-01.png" alt="" style="width:920px;" /></p>
<ul>
<li>Train weighted-evidence reasoning, not binary heuristics.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-class="figure" data-theme="neurotrailblazers" lang="POSIX" class="figure" data-marpit-pagination="13" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--class:figure;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="continuity-check-case">Continuity check case</h2>
<p><img src="../../../../assets/images/technical-training/06-axons-and-dendrites/FIG-RIV-AXDEN-S18-01.png" alt="" style="width:920px;" /></p>
<ul>
<li>Require short-path continuity inspection before final call.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="14" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="high-complexity-edge-case">High-complexity edge case</h2>
<ul>
<li>Escalate unresolved ambiguity to adjudication queue.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="15" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="operational-classification-protocol">Operational classification protocol</h2>
<ol>
<li>Initial morphology read.</li>
<li>Synaptic/organellar context check.</li>
<li>Continuity check in adjacent slices.</li>
<li>Confidence assignment.</li>
<li>Escalation if evidence conflict persists.</li>
</ol>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="16" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="misconceptions-to-correct">Misconceptions to correct</h2>
<ul>
<li>&quot;Thin process = axon&quot;.</li>
<li>&quot;One bouton-like feature determines identity&quot;.</li>
<li>&quot;Ambiguous means annotator failed&quot;.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="17" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="activity">Activity</h2>
<p>Classify three ambiguous neurites and submit:</p>
<ul>
<li>primary label,</li>
<li>cue table,</li>
<li>confidence,</li>
<li>alternate label and why rejected.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="18" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="rubric-checkpoint">Rubric checkpoint</h2>
<ul>
<li>Pass: label plus two independent cues.</li>
<li>Strong: includes continuity evidence and uncertainty logic.</li>
<li>Flag: unsupported hard labels.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="19" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="external-paper-figure-integration">External paper figure integration</h2>
<ul>
<li>Kasthuri et al. 2015: process morphology examples in dense reconstructions.</li>
<li>MICrONS/FlyWire morphology figures for large-scale context.</li>
<li>Optional neuroanatomy atlas figure for compartment-level validation.</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="20" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
<h2 id="external-inserted-figure-open-license">External inserted figure (open license)</h2>
<p><img src="../../../../assets/images/external/neuron-cell-diagram-en.svg" alt="" style="width:900px;" /></p>
<ul>
<li>Source URL: <a href="https://commons.wikimedia.org/wiki/Special:FilePath/Complete_neuron_cell_diagram_en.svg">https://commons.wikimedia.org/wiki/Special:FilePath/Complete_neuron_cell_diagram_en.svg</a></li>
<li>License: Public domain (Wikimedia Commons file metadata).</li>
</ul>
<footer>Unit 06 · Axons and dendrites</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Unit 06 · Axons and dendrites" data-theme="neurotrailblazers" lang="POSIX" data-marpit-pagination="21" style="--paginate:true;--footer:Unit 06 · Axons and dendrites;--theme:neurotrailblazers;" data-marpit-pagination-total="21">
