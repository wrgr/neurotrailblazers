<h1 id="llms-for-patch-analysis">LLMs for Patch Analysis</h1>
<p>Teaching Deck</p>
<p class="cover-label">Human cortex · H01<br />Object segmentation over electron microscopy</p>
<p class="source">H01 release · Lichtman Lab / Harvard &amp; Connectomics at Google · CC BY 4.0<br />Shapson-Coe et al. (2024) · doi:10.1126/science.adk4858</p>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="learning-objectives">Learning Objectives</h2>
<ul>
<li>Identify realistic LLM use cases in connectomics patch workflows</li>
<li>Design prompt/evaluation loops with reliability checks</li>
<li>Detect hallucination and unsupported inference risks</li>
<li>Integrate LLM outputs into human-in-the-loop QC</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="session-outcomes">Session Outcomes</h2>
<ul>
<li>Learners can complete the module capability target.</li>
<li>Learners can produce one evidence-backed artifact.</li>
<li>Learners can state one limitation or uncertainty.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="capability-target">Capability Target</h2>
<p>Implement an LLM-assisted patch-analysis workflow with verification gates, confidence labeling, and explicit human override policies. Concretely: classify every output your workflow produces into named output classes, attach a verification method and a numeric acceptance threshold to each class before any output is used, measure whether the gate costs less than the task it replaces, and log model version, prompt, output, reviewer, and decision so a reader can reconstruct which claims a model touched.</p>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="concept-focus">Concept Focus</h2>
<h3 id="1-assistive-not-autonomous">1) Assistive, not autonomous</h3>
<ul>
<li><strong>Technical:</strong> LLMs should support prioritization, summarization, code drafting, and protocol guidance. They should not perform final biological adjudication — whether this profile is a synapse, whether this is a merge error, which cell type this is. The dividing line is whether an error would enter a released data product without a human seeing it. If yes, the task is human-adjudicated regardless of how well the model performs in a pilot.</li>
<li><strong>Plain language:</strong> use an LLM to help, not to decide alone.</li>
<li><strong>Misconception guardrail:</strong> fluent output means correct output.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="core-workflow">Core Workflow</h2>
<ul>
<li>Enumerate the candidate LLM tasks in your project and sort them into named output classes.</li>
<li>For each class, write the verification method and a numeric acceptance threshold that can fail, before generating any output.</li>
<li>Estimate, then measure, the cost of the gate against the cost of doing the task directly; drop any class where the gate costs more.</li>
<li>Create prompt templates with an explicit output schema, and include the fields that gates depend on — for code, the version pin; for summaries, the citation list.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="core-workflow-continued">Core Workflow (continued)</h2>
<ul>
<li>Define the human override policy and the interface rule that prevents anchoring: independent human call recorded before the suggestion is shown.</li>
<li>Pilot on a small set — 20 to 50 items per class — and log every failure with its cause.</li>
<li>Set the logging fields: model name and version, prompt, raw output, verification result, reviewer, decision, timestamp.</li>
<li>Refine prompts and thresholds from the pilot, then state in your methods which output classes were LLM-assisted.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="run-of-show-60-min">Run of Show (60 min)</h2>
<ul>
<li>00:00-08:00 scope boundaries and failure examples.</li>
<li>08:00-20:00 prompt template design, including the schema fields each gate depends on.</li>
<li>20:00-34:00 generate sample outputs live for the worked example's three output classes (a query, a patch description, a citation list) and score reliability against a known answer; record agreement counts rather than impressions.</li>
<li>34:00-46:00 define verification and override rules per output class, and estimate the cost of each gate.</li>
<li>46:00-56:00 produce governance checklist and risk register, with one class explicitly marked as not yet usable.</li>
<li>56:00-60:00 competency check: each learner states one output class they would refuse to gate, and why.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="misconceptions-to-watch">Misconceptions to Watch</h2>
<ul>
<li><strong>Misconception guardrail:</strong> fluent output means correct output.</li>
<li><strong>Misconception guardrail:</strong> spot-checking is enough when the output looks unusual.</li>
<li><strong>Misconception guardrail:</strong> LLM assistance saves time on every task it can perform.</li>
<li><strong>Misconception guardrail:</strong> chat history is sufficient traceability.</li>
<li><strong>Misconception guardrail:</strong> showing the model's answer first speeds annotators up without changing their judgment.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="studio-activity">Studio Activity</h2>
<p><strong>Scenario:</strong> Build an LLM-assisted triage helper for proofreading queues. Reviewers can inspect about 500 segments per week; the current heuristic ranks candidates by segment size and produces roughly 40% true errors in the top 500. Your team wants to know whether an LLM-assisted ranker, drawing on segment statistics and free-text QC notes, should replace it. You have a labeled holdout of 300 segments and one expert available for four hours.</p>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="activity-output-checklist">Activity Output Checklist</h2>
<ul>
<li>Evidence-linked artifact submitted.</li>
<li>At least one limitation or uncertainty stated.</li>
<li>Revision point captured from feedback.</li>
</ul>
<footer>Module 15 · NeuroTrailblazers</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="Module 15 · NeuroTrailblazers" data-theme="neurotrailblazers" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:Module 15 · NeuroTrailblazers;--theme:neurotrailblazers;" data-marpit-pagination-total="15">
<h2 id="assessment-rubric">Assessment Rubric</h2>
<ul>
<li><strong>Minimum pass:</strong> clear task boundaries, verification logic with thresholds that can fail, and logging fields including model version and prompt.</li>
<li><strong>Strong performance:</strong> a fallback named for every failure mode, an actionable governance plan, a measured or defensibly estimated gate cost for each output class, and at least one class explicitly declared not yet usable.</li>
<li><strong>Failure modes:</strong> unbounded scope, no confidence policy, missing audit trail, thresholds written after seeing the outputs, and gates whose cost was never compared with the task they replace.</li>
</ul>
